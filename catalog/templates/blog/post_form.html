{% extends 'base.html' %}

{% block title %}{% if object %}Редактировать{% else %}Создать{% endif %} запись — Блог{% endblock %}

{% block content %}
    <h1>{% if object %}Редактировать{% else %}Создать{% endif %} запись</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn" style="background-color: #28a745; color: white;">Сохранить</button>
    </form>
    <br>
    <a href="{% url 'post_list' %}" class="btn">Отмена</a>
{% endblock %}
