{% extends 'base.html' %}

{% block title %}Удалить запись{% endblock %}

{% block content %}
    <h1>Удалить запись</h1>
    <p>Вы уверены, что хотите удалить запись «{{ object.title }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn" style="background-color: #dc3545; color: white;">Удалить</button>
    </form>
    <br>
    <a href="{% url 'post_detail' object.pk %}" class="btn">Отмена</a>
{% endblock %}
